services:
  - type: web
    name: licita-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PNCP_BASE_URL
        value: https://pncp.gov.br/api/consulta/v1
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: PNCP_SYNC_SECRET
        sync: false

  - type: worker
    name: licita-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python worker.py
    envVars:
      - key: PNCP_BASE_URL
        value: https://pncp.gov.br/api/consulta/v1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PNCP_SYNC_SECRET
        sync: false
      - key: PNCP_SCRAPE_USER_AGENT_POOL
        value: LicitaAI/0.1 (+https://github.com/Raulsakata/licita_ai; channel=sync)|LicitaAI/0.1 (+https://github.com/Raulsakata/licita_ai; channel=scrape)

  - type: web
    name: licita-web
    runtime: static
    buildCommand: npm install && npm run build -w @licita/web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
